name: Pipeline 3 - Application CI/CD

on:
  workflow_dispatch:

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout My-project
        uses: actions/checkout@v4

      - name: Clone application repository
        run: |
          git clone https://github.com/virajwirle/mern-docker-deployment.git application

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image variables
        run: |
          echo "ECR_REGISTRY=769449464695.dkr.ecr.ap-southeast-2.amazonaws.com" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=v-${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build frontend image
        run: |
          docker build \
            -t "$ECR_REGISTRY/my-project-app:${IMAGE_TAG}-frontend" \
            ./application/client

      - name: Build backend image
        run: |
          docker build \
            -t "$ECR_REGISTRY/my-project-app:${IMAGE_TAG}-backend" \
            ./application/server

      - name: Push frontend image
        run: |
          docker push "$ECR_REGISTRY/my-project-app:${IMAGE_TAG}-frontend"

      - name: Push backend image
        run: |
          docker push "$ECR_REGISTRY/my-project-app:${IMAGE_TAG}-backend"

      - name: Deploy application to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -e

          mkdir -p "$HOME/.ssh"

          printf '%s\n' "$EC2_SSH_KEY" > "$HOME/.ssh/mykey-1.pem"
          chmod 600 "$HOME/.ssh/mykey-1.pem"

          ssh-keyscan -H "$EC2_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null || true

          ssh -o StrictHostKeyChecking=no \
            -i "$HOME/.ssh/mykey-1.pem" \
            ec2-user@"$EC2_HOST" \
            "ECR_REGISTRY='$ECR_REGISTRY' IMAGE_TAG='$IMAGE_TAG' bash -s" <<'REMOTE_SCRIPT'

          set -e

          echo "======================================"
          echo "Logging into Amazon ECR"
          echo "======================================"

          aws ecr get-login-password --region ap-southeast-2 | \
            docker login \
            --username AWS \
            --password-stdin "$ECR_REGISTRY"

          echo "======================================"
          echo "Pulling frontend image"
          echo "======================================"

          docker pull \
            "$ECR_REGISTRY/my-project-app:${IMAGE_TAG}-frontend"

          echo "======================================"
          echo "Pulling backend image"
          echo "======================================"

          docker pull \
            "$ECR_REGISTRY/my-project-app:${IMAGE_TAG}-backend"

          echo "======================================"
          echo "Creating Docker network"
          echo "======================================"

          docker network create my-project-network 2>/dev/null || true

          echo "======================================"
          echo "Starting MongoDB"
          echo "======================================"

          docker rm -f mongodb 2>/dev/null || true

          docker run -d \
            --name mongodb \
            --network my-project-network \
            --restart unless-stopped \
            -v my-project-mongodb-data:/data/db \
            mongo:8

          echo "Waiting for MongoDB..."

          sleep 10

          echo "======================================"
          echo "Stopping old application containers"
          echo "======================================"

          docker rm -f my-project-frontend 2>/dev/null || true
          docker rm -f server 2>/dev/null || true

          echo "======================================"
          echo "Starting backend"
          echo "======================================"

          docker run -d \
            --name server \
            --network my-project-network \
            --restart unless-stopped \
            -e PORT=5000 \
            -e MONGODB_URI="mongodb://mongodb:27017/myproject" \
            "$ECR_REGISTRY/my-project-app:${IMAGE_TAG}-backend"

          echo "Waiting for backend..."

          sleep 10

          echo "======================================"
          echo "Starting frontend"
          echo "======================================"

          docker run -d \
            --name my-project-frontend \
            --network my-project-network \
            --restart unless-stopped \
            -p 80:80 \
            "$ECR_REGISTRY/my-project-app:${IMAGE_TAG}-frontend"

          echo "======================================"
          echo "Running containers"
          echo "======================================"

          docker ps

          echo "======================================"
          echo "Testing application"
          echo "======================================"

          for i in {1..10}; do
            if curl -fsS http://localhost >/dev/null; then
              echo "Application is healthy."
              break
            fi

            echo "Waiting for application..."
            sleep 3
          done

          echo "======================================"
          echo "Deployment complete"
          echo "======================================"

          REMOTE_SCRIPT
