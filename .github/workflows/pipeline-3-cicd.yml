name: Pipeline 3 - Application CI/CD

on:
  workflow_dispatch:

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout My-project
      - name: Checkout My-project
        uses: actions/checkout@v4

      # 2. Get application source code
      - name: Clone application repository
        run: |
          git clone https://github.com/virajwirle/mern-docker-deployment.git application

      # 3. Configure AWS
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      # 4. Login to ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 5. Create image variables
      - name: Set image variables
        run: |
          echo "ECR_REGISTRY=769449464695.dkr.ecr.ap-southeast-2.amazonaws.com" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=v-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # 6. Build frontend Docker image
      - name: Build frontend image
        run: |
          docker build \
            -t "$ECR_REGISTRY/my-project-app:${IMAGE_TAG}-frontend" \
            ./application/client

      # 7. Build backend Docker image
      - name: Build backend image
        run: |
          docker build \
            -t "$ECR_REGISTRY/my-project-app:${IMAGE_TAG}-backend" \
            ./application/server

      # 8. Push frontend image
      - name: Push frontend image
        run: |
          docker push "$ECR_REGISTRY/my-project-app:${IMAGE_TAG}-frontend"

      # 9. Push backend image
      - name: Push backend image
        run: |
          docker push "$ECR_REGISTRY/my-project-app:${IMAGE_TAG}-backend"

      # 10. Deploy to EC2
      - name: Deploy application to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |

          mkdir -p ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/mykey-1.pem

          chmod 600 ~/.ssh/mykey-1.pem

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          MONGODB_URI_ESCAPED=$(printf '%q' "$MONGODB_URI")

          ssh -i ~/.ssh/mykey-1.pem \
            ec2-user@"$EC2_HOST" \
            "ECR_REGISTRY='$ECR_REGISTRY' IMAGE_TAG='$IMAGE_TAG' MONGODB_URI=$MONGODB_URI_ESCAPED bash -s" <<'REMOTE_SCRIPT'

          set -e

          echo "Logging into ECR..."

          aws ecr get-login-password --region ap-southeast-2 | \
            docker login \
            --username AWS \
            --password-stdin "$ECR_REGISTRY"

          echo "Pulling frontend image..."

          docker pull \
            "$ECR_REGISTRY/my-project-app:${IMAGE_TAG}-frontend"

          echo "Pulling backend image..."

          docker pull \
            "$ECR_REGISTRY/my-project-app:${IMAGE_TAG}-backend"

          echo "Creating Docker network..."

          docker network create my-project-network 2>/dev/null || true

          echo "Stopping old containers..."

          docker rm -f my-project-frontend 2>/dev/null || true
          docker rm -f server 2>/dev/null || true

          echo "Starting backend..."

          docker run -d \
            --name server \
            --network my-project-network \
            --restart unless-stopped \
            -e PORT=5000 \
            -e MONGODB_URI="$MONGODB_URI" \
            "$ECR_REGISTRY/my-project-app:${IMAGE_TAG}-backend"

          echo "Starting frontend..."

          docker run -d \
            --name my-project-frontend \
            --network my-project-network \
            --restart unless-stopped \
            -p 80:80 \
            "$ECR_REGISTRY/my-project-app:${IMAGE_TAG}-frontend"

          echo "Deployment complete."

          echo "Running containers:"
          docker ps

          echo "Testing Nginx:"
          curl -I http://localhost

          REMOTE_SCRIPT
